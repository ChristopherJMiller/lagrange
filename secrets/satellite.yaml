# PLACEHOLDER — replace with sops-encrypted content before deploy.
# See secrets/README.md for the bootstrap procedure.
#
# This file exists so `nix flake check` passes against an un-bootstrapped
# tree. Activation will fail loudly on the satellite if it is still in
# this state when comin tries to apply.

comin-token: ENC[placeholder]
wg-private-key: ENC[placeholder]
admin-service-token: ENC[placeholder]
atticd-env: ENC[placeholder]
deploy-keys-tar: ENC[placeholder]

sops:
  kms: []
  gcp_kms: []
  azure_kv: []
  hc_vault: []
  age:
    - recipient: age1__PLACEHOLDER__
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        PLACEHOLDER
        -----END AGE ENCRYPTED FILE-----
  lastmodified: "1970-01-01T00:00:00Z"
  mac: ENC[placeholder]
  pgp: []
  unencrypted_suffix: _unencrypted
  version: 3.10.0
