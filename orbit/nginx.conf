server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Tight caching for the SPA shell, aggressive for hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static favicons, etc.
    location ~* \.(svg|ico|png|webp|woff2?)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback — orbit is single-screen so this is mostly defensive.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth: orbit MUST NOT serve API traffic.
    # The k8s ingress is what routes /v1 to the admin service.
    # If something is misconfigured upstream and a /v1 request lands here,
    # return 502 loudly rather than rendering the SPA shell for it.
    location /v1/ {
        return 502 "orbit cannot proxy /v1 — ingress misconfigured\n";
        add_header Content-Type text/plain;
    }

    # Lightweight liveness for k8s.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Security baseline. Loosened CSP because the SPA inlines styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;
}
