server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;

    # Behind an ingress, nginx's default absolute redirects pin the wrong
    # port (the container's listen port instead of the ingress's external
    # port). Emit Location headers as paths and let the browser resolve
    # them relative to the request URL.
    absolute_redirect off;

    # Lightweight liveness for k8s. Kept at root so kubelet's probe doesn't
    # have to know about the /orbit prefix.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Defence in depth: the cluster ingress fans /v1 to the admin service,
    # but if a misconfiguration ever routes /v1 here, fail loudly rather
    # than rendering the SPA shell as the API response body.
    location /v1/ {
        return 502 "orbit cannot proxy /v1 — ingress misconfigured\n";
        add_header Content-Type text/plain;
    }

    # Bare root → /orbit/ so anyone who lands on the pod IP isn't greeted
    # with a 404. The ingress should send users straight to /orbit; this
    # is just a convenience.
    location = / {
        return 302 /orbit/;
    }
    location = /orbit {
        return 302 /orbit/;
    }

    # Hashed JS/CSS chunks. Vite is built with base: '/orbit/', so all
    # asset references are /orbit/assets/<hash>.{js,css}. `alias`
    # (not `root`) strips the /orbit/ prefix when mapping to the
    # filesystem. Trailing slashes on both sides matter.
    location /orbit/assets/ {
        alias /usr/share/nginx/html/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files at the SPA root (favicon, etc.) — short cache.
    location ~* ^/orbit/.+\.(svg|ico|png|webp|woff2?)$ {
        rewrite ^/orbit/(.*)$ /$1 break;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA shell + fallback. Any non-asset path under /orbit serves
    # index.html so the React app can render the route client-side.
    # No-store on the shell itself so deploys are picked up immediately.
    location /orbit/ {
        alias /usr/share/nginx/html/;
        index index.html;
        # The last try_files arg starting with `/` is the internal-redirect
        # fallback (NOT another file check) — that's how the SPA shell is
        # served for deep links. Adding `=404` after it would make
        # /orbit/index.html a file check, which interacts badly with alias
        # and 404s every deep link.
        try_files $uri $uri/ /orbit/index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Security baseline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;
}
