# orbit — lagrange admin frontend
# Stateless single replica is fine; the SPA shell is tiny and any operator
# action is idempotent on the admin-service side.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit
  namespace: lagrange
  labels:
    app.kubernetes.io/name: orbit
    app.kubernetes.io/part-of: lagrange
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orbit
          # Built and published by .github/workflows/orbit-image.yml on
          # every push to main. Pin to a sha tag in production (e.g.
          # :sha-abcd123) rather than :latest.
          image: ghcr.io/christopherjmiller/lagrange-orbit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 101 # nginx user in the official alpine image
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
