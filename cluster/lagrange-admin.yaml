# In-cluster Service that fronts the Lagrange admin API.
#
# Lagrange has a WireGuard interface at 10.99.0.2; the admin service listens
# only on 10.99.0.2:8443. We expose it inside the cluster by pinning an
# Endpoints object at that address. The wg-gateway Deployment is what makes
# 10.99.0.2 routable from cluster pods.

apiVersion: v1
kind: Secret
metadata:
  name: lagrange-admin-token
  namespace: ops
type: Opaque
stringData:
  # Must match the value in hosts/lagrange/secrets.nix → sops admin-service-token.
  # nginx injects this into the upstream Authorization header so end users
  # only see authentik, not the bearer token.
  token: REPLACE_WITH_BEARER_TOKEN_MATCHING_LAGRANGE
---
apiVersion: v1
kind: Service
metadata:
  name: lagrange-admin
  namespace: ops
spec:
  type: ClusterIP
  clusterIP: None         # headless — endpoints carry the actual address
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: lagrange-admin
  namespace: ops
subsets:
  - addresses:
      - ip: 10.99.0.2    # Lagrange's WG IP
    ports:
      - name: https
        port: 8443
        protocol: TCP
---
# Ingress that fronts the admin service with authentik + bearer-token
# injection. End users authenticate against authentik; nginx adds the
# Authorization header before forwarding so the user never sees the token.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lagrange-admin
  namespace: ops
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://authentik.example.com/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://authentik.example.com/outpost.goauthentik.io/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-Authentik-Username,X-Authentik-Groups"
    # The bearer-token injection: lift from a Secret-mounted file into the
    # request. Requires the nginx ingress 'lua' / 'configuration-snippet'
    # feature to be enabled in the controller's ConfigMap.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      access_by_lua_block {
        local f = io.open("/etc/lagrange/token", "r")
        if f then
          local token = f:read("*l")
          f:close()
          ngx.req.set_header("Authorization", "Bearer " .. token)
        end
      }
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
    - hosts: [lagrange.internal.example]
      secretName: lagrange-admin-tls
  rules:
    - host: lagrange.internal.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lagrange-admin
                port:
                  number: 8443
