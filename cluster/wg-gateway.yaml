# Cluster-side WireGuard gateway. Lagrange dials into this; cluster pods
# reach the Lagrange admin service via the in-cluster Service below.
#
# Apply order: this Deployment first, then the Service+Endpoints, then the
# Ingress.

apiVersion: v1
kind: Namespace
metadata:
  name: ops
---
apiVersion: v1
kind: Secret
metadata:
  name: wg-gateway
  namespace: ops
type: Opaque
stringData:
  # Cluster-side WireGuard private key. Generate with:
  #   wg genkey | tee privatekey | wg pubkey > publickey
  # Then store the privatekey here and put publickey in
  # hosts/lagrange/secrets.nix as lagrange.wireguard.clusterPeer.publicKey.
  privatekey: REPLACE_WITH_CLUSTER_WG_PRIVATE_KEY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-gateway
  namespace: ops
data:
  wg0.conf: |
    [Interface]
    Address    = 10.99.0.1/32
    ListenPort = 51820
    # privatekey is injected from the Secret above via wg-quick

    [Peer]
    # Lagrange's public key. Generate on Lagrange via:
    #   wg genkey | tee /var/lib/wg/privatekey | wg pubkey > /var/lib/wg/publickey
    PublicKey  = REPLACE_WITH_LAGRANGE_WG_PUBLIC_KEY
    AllowedIPs = 10.99.0.2/32
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-gateway
  namespace: ops
  labels: { app: wg-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: wg-gateway } }
  template:
    metadata:
      labels: { app: wg-gateway }
    spec:
      containers:
        - name: wg
          image: ghcr.io/linuxserver/wireguard:latest
          securityContext:
            capabilities:
              add: [NET_ADMIN, SYS_MODULE]
          env:
            - name: PEERS
              value: "0"          # We bring our own peers from the ConfigMap.
            - name: SERVERURL
              value: "auto"
            - name: SERVERPORT
              value: "51820"
            - name: LOG_CONFS
              value: "false"
          volumeMounts:
            - { name: config, mountPath: /config/wg_confs/wg0.conf, subPath: wg0.conf }
            - { name: secret, mountPath: /run/secrets/wg-gateway, readOnly: true }
            - { name: modules, mountPath: /lib/modules, readOnly: true }
          ports:
            - containerPort: 51820
              protocol: UDP
          readinessProbe:
            exec: { command: [sh, -c, "wg show wg0 peers | grep -q ."] }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: wg-gateway }
        - name: secret
          secret: { secretName: wg-gateway }
        - name: modules
          hostPath: { path: /lib/modules }
---
apiVersion: v1
kind: Service
metadata:
  name: wg-gateway
  namespace: ops
spec:
  type: LoadBalancer    # or NodePort with a stable nodePort; whichever the cluster uses
  ports:
    - name: wg
      port: 51820
      targetPort: 51820
      protocol: UDP
  selector:
    app: wg-gateway
