name: orbit-image

on:
  push:
    branches: [main]
    paths:
      - 'orbit/**'
      - '.github/workflows/orbit-image.yml'
  pull_request:
    paths:
      - 'orbit/**'
      - '.github/workflows/orbit-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Package coords: ghcr.io/<owner>/lagrange-orbit. Sibling to the existing
  # repo's GHCR packages; flat naming avoids the awkward
  # ghcr.io/owner/lagrange/orbit form.
  IMAGE_NAME: ${{ github.repository_owner }}/lagrange-orbit

jobs:
  build:
    name: build${{ github.event_name == 'pull_request' && '' || ' + push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `latest` only on main pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # Branch-named tag for non-default branches
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            # Always: short sha
            type=sha,format=short
            # PR builds get a pr-NN tag (not pushed; useful for inspection)
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=orbit
            org.opencontainers.image.description=Lagrange mission-control UI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build${{ github.event_name == 'pull_request' && '' || ' + push' }}
        uses: docker/build-push-action@v6
        with:
          context: orbit
          file: orbit/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orbit
          cache-to: type=gha,mode=max,scope=orbit
          # amd64 only for now — the satellite host is x86_64. Re-enable
          # arm64 once we actually have an arm64 deploy target.
          platforms: linux/amd64
