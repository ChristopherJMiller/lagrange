[package]
name = "lagrange-admin"
version = "0.1.0"
edition = "2021"
description = "Lagrange compute satellite — repo-VM lifecycle service"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "auth"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
url = "2"
ipnet = "2"
regex = "1"
once_cell = "1"
hex = "0.4"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
